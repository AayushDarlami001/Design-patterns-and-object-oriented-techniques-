services:

  postgres:
    image: postgres:16
    container_name: smart-greenhouse-postgres

    environment:
      POSTGRES_USER: greenhouse
      POSTGRES_PASSWORD: greenhouse
      POSTGRES_DB: greenhouse

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenhouse -d greenhouse"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: smart-greenhouse-backend

    working_dir: /app

    volumes:
      - ./backend:/app

    environment:
      DATABASE_URL: postgresql+psycopg://greenhouse:greenhouse@postgres:5432/greenhouse
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: http://localhost:5173

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: smart-greenhouse-frontend

    working_dir: /app

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      VITE_API_BASE_URL: http://localhost:8000

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  postgres_data: